
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servicify | Serviceman Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, #6565f5, #dfe5ff);
        }

        .container {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 40px 35px;
            border-radius: 22px;
            box-shadow: 0 15px 45px rgba(40, 35, 120, 0.18);
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 25px;
        }

        .logo span {
            color: #5145ee;
        }

        h2 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777f91;
            font-size: 14px;
            margin-bottom: 28px;
        }

        label {
            display: block;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #dfe3ed;
            border-radius: 10px;
            margin-bottom: 20px;
            outline: none;
        }

        input:focus {
            border-color: #5145ee;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #5145ee;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #4035d5;
        }

        .footer {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: #777f91;
        }

        a {
            color: #5145ee;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo"><span>Servi</span> cify</div>

        <h2>Service Provider Login</h2>
        <p class="subtitle">Log in to manage your services and bookings.</p>

        <form method="POST">
            {% csrf_token %}

            <label for="username">Username</label>
            <input type="text" id="username" name="username"
                   placeholder="Enter your username" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password"
                   placeholder="Enter your password" required>

            <button type="submit">Log In</button>
        </form>

        <div class="footer">
            Not registered yet?
            <a href="{% url 'serviceman_signup' %}">Sign Up as a Serviceman</a>
        </div>

        <div class="footer">
            <a href="{% url 'signin' %}">Customer Login</a>
        </div>
    </div>
</body>
</html>
