<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ServiciFY | Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, #6565f5, #dfe5ff);
            color: #172033;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 420px;
            padding: 40px 35px;
            border-radius: 22px;
            box-shadow: 0 15px 45px rgba(40, 35, 120, 0.18);
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 28px;
        }

        .logo span {
            color: #5145ee;
        }

        h2 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 27px;
        }

        .subtitle {
            text-align: center;
            color: #7a8191;
            font-size: 14px;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;
            border: 1px solid #dfe3ed;
            border-radius: 10px;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: #5145ee;
            box-shadow: 0 0 0 3px rgba(81, 69, 238, 0.1);
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: #5145ee;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #4035d5;
            transform: translateY(-2px);
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #777f91;
            font-size: 14px;
        }

        a {
            color: #5145ee;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="container">

        <div class="logo"><span>Servi</span> cify</div>

        <h2>Welcome Back!</h2>
        <p class="subtitle">
            Log in to book trusted home services.
        </p>

        {% if error %}
    <p style="color: red; text-align: center; margin-bottom: 15px;">
        {{ error }}
    </p>
{% endif %}

        <form method="POST">
            {% csrf_token %}

            <label for="username">Username</label>
            <input type="text" id="username" name="username"
                   placeholder="Enter your username" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password"
                   placeholder="Enter your password" required>

            <button type="submit">Log In</button>
        </form>

        <div class="footer">
            Don't have an account?
            <a href="{% url 'signup' %}">Sign Up</a>
        </div>

    </div>
</body>
</html>
