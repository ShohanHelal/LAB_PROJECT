
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Servicify | Sign Up</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px 15px;
            background: linear-gradient(135deg, #6565f5, #dfe5ff);
            color: #172033;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 480px;
            padding: 35px;
            border-radius: 22px;
            box-shadow: 0 15px 45px rgba(40, 35, 120, 0.18);
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 22px;
        }

        .logo span {
            color: #5145ee;
        }

        h2 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 27px;
        }

        .subtitle {
            text-align: center;
            color: #7a8191;
            font-size: 14px;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .auth-form p {
            margin-bottom: 15px;
        }

        .auth-form label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .auth-form input,
        .auth-form select,
        .auth-form textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #dfe3ed;
            border-radius: 10px;
            outline: none;
            font-size: 14px;
        }

        .auth-form input:focus,
        .auth-form select:focus,
        .auth-form textarea:focus {
            border-color: #5145ee;
            box-shadow: 0 0 0 3px rgba(81, 69, 238, 0.1);
        }

        .auth-form ul.errorlist {
            color: #dc2626;
            font-size: 13px;
            list-style: none;
            margin-bottom: 8px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 8px;
            border: none;
            border-radius: 12px;
            background: #5145ee;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #4035d5;
            transform: translateY(-2px);
        }

        .footer {
            text-align: center;
            margin-top: 23px;
            color: #777f91;
            font-size: 14px;
        }

        a {
            color: #5145ee;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .container {
                padding: 27px 22px;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <div class="logo"><span>Servi</span> cify</div>

        <h2>Create Account</h2>
        <p class="subtitle">
            Join Servicify and find trusted professionals for your home.
        </p>

        <form method="POST" class="auth-form">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">Create Account</button>
        </form>

        <div class="footer">
            Already have an account?
            <a href="{% url 'signin' %}">Log In</a>
        </div>

    </div>
</body>
</html>
